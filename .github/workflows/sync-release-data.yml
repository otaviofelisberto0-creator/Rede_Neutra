name: Sincronizar Releases e publicar Pages

on:
  release:
    types:
      - published
      - edited
      - released

  workflow_dispatch:

  push:
    branches:
      - principal
    paths:
      - "index.html"
      - ".nojekyll"
      - "README.md"
      - "RELEASE.md"
      - ".github/workflows/sync-release-data.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  preparar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Criar estrutura de publicação
        run: |
          rm -rf public
          mkdir -p public/data

          cp index.html public/index.html

          if [ -f ".nojekyll" ]; then
            cp .nojekyll public/.nojekyll
          else
            touch public/.nojekyll
          fi

          if [ -f "README.md" ]; then
            cp README.md public/README.md
          fi

          if [ -f "RELEASE.md" ]; then
            cp RELEASE.md public/RELEASE.md
          fi

      - name: Baixar JSONs dos Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list \
            --repo "${{ github.repository }}" \
            --limit 100 \
            --json tagName,isDraft,isPrerelease \
            > releases.json

          python3 <<'PY'
          import json
          import os
          import re
          import subprocess

          repository = os.environ["GITHUB_REPOSITORY"]

          with open("releases.json", encoding="utf-8") as file:
              releases = json.load(file)

          releases_validos = []

          for release in releases:
              tag = release.get("tagName", "")

              if release.get("isDraft"):
                  continue

              if not re.fullmatch(r"RN-\d{2}-\d{2}", tag):
                  continue

              nome_arquivo = f"{tag}.json"

              resultado = subprocess.run(
                  [
                      "gh",
                      "release",
                      "download",
                      tag,
                      "--repo",
                      repository,
                      "--pattern",
                      nome_arquivo,
                      "--dir",
                      "public/data",
                      "--clobber",
                  ],
                  capture_output=True,
                  text=True,
              )

              caminho = os.path.join("public", "data", nome_arquivo)

              if resultado.returncode != 0 or not os.path.exists(caminho):
                  print(f"Asset não localizado: {nome_arquivo}")
                  continue

              ano = 2000 + int(tag[3:5])
              mes = int(tag[6:8])

              releases_validos.append(
                  {
                      "competencia": f"{ano:04d}-{mes:02d}",
                      "arquivo": nome_arquivo,
                      "release": tag,
                  }
              )

          releases_validos.sort(
              key=lambda item: item["competencia"]
          )

          if not releases_validos:
              raise SystemExit(
                  "Nenhum asset RN-aa-mm.json foi encontrado nos Releases."
              )

          from datetime import datetime, timezone

          manifest = {
              "schemaVersion": 1,
              "atualizadoEm": datetime.now(timezone.utc).isoformat(),
              "origem": "GitHub Releases",
              "repositorio": repository,
              "arquivos": releases_validos,
          }

          with open(
              "public/data/manifest.json",
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(
                  manifest,
                  file,
                  ensure_ascii=False,
                  indent=2,
              )

          print("Arquivos publicados:")

          for item in releases_validos:
              print(
                  item["competencia"],
                  item["arquivo"],
              )
          PY

      - name: Validar JSONs
        run: |
          python3 <<'PY'
          import glob
          import json

          arquivos = glob.glob("public/data/RN-*.json")

          if not arquivos:
              raise SystemExit("Nenhum JSON foi preparado.")

          for caminho in arquivos:
              with open(caminho, encoding="utf-8") as file:
                  conteudo = json.load(file)

              if not isinstance(conteudo, (dict, list)):
                  raise SystemExit(
                      f"Estrutura inválida: {caminho}"
                  )

              print(f"OK: {caminho}")
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar pacote do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: preparar

    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
