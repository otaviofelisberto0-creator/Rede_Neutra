name: Sincronizar lancamentos e publicar paginas

on:
  release:
    types: [published, released, edited]

  push:
    branches: [main]
    paths:
      - "index.html"
      - ".nojekyll"
      - "README.md"
      - "RELEASE.md"
      - ".github/workflows/sync-release-data.yml"

  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rede-neutra-pages
  cancel-in-progress: true

jobs:
  preparar:
    name: Preparar painel e dados dos Releases
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Criar estrutura da publicacao
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public/data

          test -f index.html || { echo "index.html nao encontrado"; exit 1; }
          cp index.html public/index.html

          if [ -f .nojekyll ]; then
            cp .nojekyll public/.nojekyll
          else
            touch public/.nojekyll
          fi

          [ -f README.md ] && cp README.md public/README.md || true
          [ -f RELEASE.md ] && cp RELEASE.md public/RELEASE.md || true

      - name: Localizar e baixar JSONs dos Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          gh release list \
            --repo "$GH_REPO" \
            --limit 100 \
            --json tagName,isDraft,isPrerelease \
            > releases.json

          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ["GH_REPO"]
          data_dir = Path("public/data")
          data_dir.mkdir(parents=True, exist_ok=True)
          releases = json.loads(Path("releases.json").read_text(encoding="utf-8"))
          arquivos = []

          for release in releases:
              tag = str(release.get("tagName", "")).strip()
              if release.get("isDraft"):
                  continue
              if not re.fullmatch(r"RN-\d{2}-\d{2}", tag):
                  continue

              asset = f"{tag}.json"
              destino = data_dir / asset
              result = subprocess.run(
                  ["gh", "release", "download", tag,
                   "--repo", repo, "--pattern", asset,
                   "--dir", str(data_dir), "--clobber"],
                  text=True, capture_output=True
              )

              if result.returncode != 0 or not destino.exists():
                  print(f"AVISO: asset ausente: {asset}")
                  if result.stderr:
                      print(result.stderr)
                  continue

              try:
                  json.loads(destino.read_text(encoding="utf-8-sig"))
              except Exception as exc:
                  raise SystemExit(f"JSON invalido em {asset}: {exc}")

              ano = 2000 + int(tag[3:5])
              mes = int(tag[6:8])
              arquivos.append({
                  "competencia": f"{ano:04d}-{mes:02d}",
                  "arquivo": asset,
                  "release": tag
              })

          arquivos.sort(key=lambda item: item["competencia"])
          if not arquivos:
              raise SystemExit("Nenhum asset RN-aa-mm.json encontrado nos Releases publicados.")

          manifest = {
              "schemaVersion": 1,
              "origem": "GitHub Releases",
              "repositorio": repo,
              "atualizadoEm": datetime.now(timezone.utc).isoformat(),
              "arquivos": arquivos
          }

          Path("public/data/manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("Arquivos sincronizados:")
          for item in arquivos:
              print(f"- {item['competencia']} | {item['arquivo']}")
          PY

      - name: Validar pacote
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/data/manifest.json
          python3 -m json.tool public/data/manifest.json > /dev/null
          ls -lh public/data

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publicar:
    name: Publicar GitHub Pages
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar painel
        id: deployment
        uses: actions/deploy-pages@v4
